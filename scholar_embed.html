<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Scholar Publications | Dr. Veerapandiyan Veerasamy</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/publications.css">
    <style>
        body {
            background-color: #ffffff;
            padding: 1.25rem;
            margin: 0;
            min-height: 100vh;
        }
        .embed-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: #ffffff;
            padding: 1.25rem 1.5rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 12px rgba(15, 76, 129, 0.15);
        }
        .embed-header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .embed-logo-box {
            width: 44px;
            height: 44px;
            background: #ffffff;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-color);
            flex-shrink: 0;
        }
        .embed-header-titles h2 {
            margin: 0;
            color: #ffffff;
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .embed-header-titles p {
            margin: 2px 0 0;
            color: rgba(255, 255, 255, 0.85);
            font-size: 0.85rem;
        }
        .embed-header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .embed-scholar-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #ffffff;
            color: var(--primary-color);
            font-size: 0.85rem;
            font-weight: 600;
            padding: 7px 14px;
            border-radius: 20px;
            text-decoration: none;
            transition: transform 0.2s, background 0.2s;
        }
        .embed-scholar-link:hover {
            background: #f8fafc;
            transform: translateY(-2px);
            text-decoration: none;
            color: var(--primary-color);
        }
        .embed-badges-summary {
            display: flex;
            gap: 8px;
            margin-bottom: 1.25rem;
            flex-wrap: wrap;
        }
        .embed-stat-chip {
            background: var(--bg-alt);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            color: var(--text-main);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .embed-stat-chip strong {
            color: var(--primary-color);
            font-size: 0.95rem;
        }
    </style>
    <!-- Synchronous Data Source (guarantees instantaneous rendering with 0 network latency and 0 CORS issues) -->
    <script src="js/scholar-data.js"></script>
    <script src="js/publications.js" defer></script>
</head>
<body>

    <!-- Embed Header Bar -->
    <header class="embed-header">
        <div class="embed-header-left">
            <div class="embed-logo-box">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                </svg>
            </div>
            <div class="embed-header-titles">
                <h2>
                    Dr. Veerapandiyan Veerasamy
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="#38bdf8" stroke="#38bdf8" stroke-width="2" title="Verified Profile">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                        <polyline points="22 4 12 14.01 9 11.01"></polyline>
                    </svg>
                </h2>
                <p>Google Scholar Recent Publications & Impact Feed</p>
            </div>
        </div>
        <div class="embed-header-right">
            <a href="https://scholar.google.com/citations?hl=en&user=vzf72BMAAAAJ&view_op=list_works&sortby=pubdate" target="_blank" rel="noopener" class="embed-scholar-link">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                    <polyline points="15 3 21 3 21 9"></polyline>
                    <line x1="10" y1="14" x2="21" y2="3"></line>
                </svg>
                Live Profile
            </a>
        </div>
    </header>

    <!-- Quick Stat Chips -->
    <div class="embed-badges-summary">
        <div class="embed-stat-chip">
            <span>Citations:</span>
            <strong>2,936+</strong>
        </div>
        <div class="embed-stat-chip">
            <span>h-index:</span>
            <strong>30</strong>
        </div>
        <div class="embed-stat-chip">
            <span>i10-index:</span>
            <strong>55</strong>
        </div>
        <div class="embed-stat-chip" style="background: #fff8eb; border-color: #fde68a; color: #b45309;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
            </svg>
            <strong>Top 2% Scientist</strong>
        </div>
    </div>

    <!-- Search & Filters Toolbar -->
    <div id="publications-toolbar-container"></div>

    <!-- Publications List -->
    <div id="publications-list">
        <!-- Rendered dynamically by publications.js -->
    </div>

</body>
</html>
